<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Technical SEO & Meta Tags (Pehle wale se) -->
    <title>Upthrust | Bold Design That Performs</title>
    <meta name="description" content="Upthrust design landing page featuring 3D elements and functional forms.">
    <link rel="canonical" href="https://your-deployment-link.com" />

    <!-- Open Graph for Social Sharing (Pehle wale se) -->
    <meta property="og:title" content="Upthrust | Landing Page">
    <meta property="og:description" content="Bold Design That Performs">
    <meta property="og:image" content="link-to-your-og-image.jpg">
    <meta property="og:type" content="website">

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">

    <!-- 🌟 YEH HAI WO MAGIC SCRIPT JO BINA REACT KE 3D RENDER KAREGI (Dusre wale se) 🌟 -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <!-- Header for Navbar -->
    <header>
        <!-- Navbar yahan aayega agar Figma me hai -->
    </header>

    <main>
        <!-- 1. Hero Section -->
        <section class="hero-section" id="hero">
            <div class="hero-content">
                <!-- ONLY ONE H1 allowed for SEO -->
                <h1 class="main-title">BOLD DESIGN <br> THAT <br> PERFORMS</h1>
                
                <!-- Asali 3D Statue yahan dikhegi -->
                <model-viewer 
                    src="assets/Updated statue.glb" 
                    alt="3D Statue Head" 
                    auto-rotate 
                    camera-controls 
                    disable-zoom 
                    style="width: 100%; height: 400px;">
                </model-viewer>
            </div>
        </section>

        <!-- 2. Services Section -->
        <section class="services-section">
            <!-- 3D Ghoomti hui pipe yahan dikhegi -->
            <model-viewer 
                src="assets/curve line with dark orange.glb" 
                alt="3D Orange Pipe" 
                auto-rotate 
                disable-zoom 
                style="width: 100%; height: 200px;">
            </model-viewer>
            
            <div class="services-container">
                <div class="service-card">
                    <h2>Strategy and insight</h2>
                </div>
                <div class="service-card">
                    <h2>Brand & visual identity</h2>
                </div>
            </div>
        </section>

        <!-- 3. Form Section -->
        <section class="contact-section">
            <form id="upthrust-form">
                <input type="email" id="email" placeholder="Enter your email" required>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <!-- 4. Footer -->
    <footer class="main-footer">
        <h2>UPTHRUST DESIGN</h2>
    </footer>

    <!-- JavaScript Link -->
    <script src="script.js" defer></script>
</body>
</html>
